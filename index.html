<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portal Oficial</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
    }

    header {
      background-color: #0b3d91;
      color: white;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    nav {
      background-color: #e6e6e6;
      padding: 10px;
    }

    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #0b3d91;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    footer {
      background-color: #0b3d91;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

<body>

  <header>
    Portal Oficial do Sistema
  </header>

  <nav>
    <a href="#">Início</a>
    <a href="#">Serviços</a>
    <a href="#">Consulta</a>
    <a href="#">Contato</a>
  </nav>

  <div class="container">

    <div class="card">
      <h2>Bem-vindo</h2>
      <p>Este é um ambiente restrito para acesso a informações oficiais.</p>
    </div>

    <div class="card">
      <h2>Status do Sistema</h2>
      <p>Sistema operando normalmente.</p>
    </div>

  </div>

  <footer>
    © 2026 Governo - Todos os direitos reservados
  </footer>

</body>
</html>
